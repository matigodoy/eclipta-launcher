plugins {
    id 'com.android.application'
}

android {
    namespace 'ar.com.eclipta.launcher'
    compileSdk 36

    defaultConfig {
        applicationId 'ar.com.eclipta.launcher'
        minSdk 28
        // Deliberately low: manifest receivers keep getting JanCar's implicit broadcasts. Sideload only.
        //noinspection ExpiredTargetSdkVersion
        targetSdk 25
        versionCode 9
        versionName '0.6.0'
    }

    // Release signing comes from launcher/keystore.properties (git-ignored). Never commit the keystore.
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) {
        def ks = new Properties()
        keystoreFile.withInputStream { ks.load(it) }
        signingConfigs {
            release {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // Binder clients are hand-written and everything else is reached from the manifest.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    // Local-only assets (your own logo animation, car photo) override the public ones. Git-ignored.
    // Build-type source sets win over main, so same-named resources replace instead of clashing.
    def privateRes = rootProject.file('private-res')
    // -PpublicBuild skips them (used by scripts/release.sh).
    if (privateRes.exists() && !project.hasProperty('publicBuild')) {
        sourceSets {
            debug.res.srcDirs += privateRes
            release.res.srcDirs += privateRes
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Already compressed. Stored as is, the wake animation decodes without inflating into memory first.
    androidResources {
        noCompress 'webp'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // org.json is only a stub in unit tests.
    testImplementation 'org.json:json:20240303'
}
