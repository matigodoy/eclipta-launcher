name: Pack nuevo
description: Pedí ayuda para armar el pack de tu modelo (se carga por pendrive; los modelos reales no van en el APK)
title: "[Pack] "
labels: [pack]
body:
  - type: input
    id: car
    attributes: {label: "Modelo, generación y años", placeholder: "Audi A4 B8 2008-2015"}
    validations: {required: true}
  - type: textarea
    id: photo
    attributes:
      label: Foto
      description: "Foto propia, de 3/4 de frente, entera y bien iluminada. Tapá la patente antes de subirla. Guía en docs/08-packs.md: el pack queda para tu pendrive, no se suma al repo."
