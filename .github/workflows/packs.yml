name: Validar packs
on:
  pull_request:
    paths: ["launcher/app/src/main/assets/packs/**", "scripts/validate_packs.py"]
  push:
    paths: ["launcher/app/src/main/assets/packs/**", "scripts/validate_packs.py"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_packs.py launcher/app/src/main/assets/packs
